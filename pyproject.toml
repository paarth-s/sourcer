[project]
name = "sourcer"
version = "0.1.0"
description = "Early-signal job sourcing: funding news, ATS boards and your LinkedIn network, scored against your background."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
sourcer = "sourcer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sourcer*"]
