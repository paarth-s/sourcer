name: sourcer

# Daily digest email at ~7am America/Los_Angeles.
# GitHub cron is UTC-only, so it fires at 13:45 and 14:45 UTC (6:45 PDT / 6:45 PST);
# `run --daily` sends once per local day and skips the run that lands before 6am.
on:
  schedule:
    - cron: "45 13 * * *"
    - cron: "45 14 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = full run + email now; preview = email everything currently matching (doesn't affect daily emails); test-email = just check delivery"
        type: choice
        options: [daily, preview, test-email]
        default: daily

concurrency:
  group: sourcer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Email delivery (README > Daily email). Resend is simplest; SMTP also works.
      DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install ".[llm]"

      - name: Test email delivery
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test-email'
        run: python -m sourcer test-email

      # State (seen jobs, discovered boards, last email date) persists in the Actions cache.
      - name: Restore state
        if: github.event_name == 'schedule' || inputs.mode != 'test-email'
        uses: actions/cache/restore@v4
        with:
          path: data/sourcer.db
          key: sourcer-db-v2-${{ github.run_id }}
          restore-keys: sourcer-db-v2-

      # Private inputs live in secrets, never in this (public) repo:
      #   gzip -c Connections.csv | base64 | gh secret set LINKEDIN_CONNECTIONS_B64
      #   base64 -i private/resume.yaml  | gh secret set RESUME_YAML_B64
      #   base64 -i private/answers.yaml | gh secret set ANSWERS_YAML_B64
      - name: Load private inputs
        if: github.event_name == 'schedule' || inputs.mode != 'test-email'
        env:
          CONNECTIONS_B64: ${{ secrets.LINKEDIN_CONNECTIONS_B64 }}
          RESUME_B64: ${{ secrets.RESUME_YAML_B64 }}
          ANSWERS_B64: ${{ secrets.ANSWERS_YAML_B64 }}
        run: |
          mkdir -p data private
          if [ -n "$CONNECTIONS_B64" ]; then
            echo "$CONNECTIONS_B64" | base64 -d > data/Connections.raw
            # accepts plain or gzip-compressed CSV (large exports exceed the 48KB secret limit)
            if gzip -t data/Connections.raw 2>/dev/null; then gunzip -c data/Connections.raw > data/Connections.csv
            else mv data/Connections.raw data/Connections.csv; fi
          fi
          if [ -n "$RESUME_B64" ]; then echo "$RESUME_B64" | base64 -d > private/resume.yaml; fi
          if [ -n "$ANSWERS_B64" ]; then echo "$ANSWERS_B64" | base64 -d > private/answers.yaml; fi

      # Only counts are printed: this repo's Actions logs are public.
      - name: Run and email
        if: github.event_name == 'schedule' || inputs.mode == 'daily'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m sourcer run --daily ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }} 2> data/run.log

      - name: Preview email
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m sourcer run --preview 2> data/run.log

      - name: Show errors
        if: failure()
        run: grep -E "ERROR|Traceback|Error:" data/run.log | tail -20 || true

      - name: Save state
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'daily')
        uses: actions/cache/save@v4
        with:
          path: data/sourcer.db
          key: sourcer-db-v2-${{ github.run_id }}
