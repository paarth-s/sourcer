#   ats/slug  - Greenhouse, Lever, Ashby, SmartRecruiters or Workable board (optional:
#               if omitted, sourcer guesses slugs from the name)
#   workday   - the company's Workday careers URL (most large companies)
#   note      - context shown next to this company's roles in the email
#
# Funded companies, YC startups and LinkedIn-connection companies are added
